apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # --- Training server: strip GKE bits, swap PVC for emptyDir ---
  - target:
      kind: Deployment
      name: training-server-deployment
    patch: |
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: model-storage
            mountPath: /models
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: model-storage
            emptyDir: {}

  # --- Prediction server: strip GKE bits, scale to 1 replica ---
  - target:
      kind: Deployment
      name: prediction-server-deployment
    patch: |
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: replace
        path: /spec/replicas
        value: 1

  # --- Services: ClusterIP (no LB in Kind) ---
  - target:
      kind: Service
      name: prediction-service
    patch: |
      - op: replace
        path: /spec/type
        value: ClusterIP

  - target:
      kind: Service
      name: training-service-external
    patch: |
      - op: replace
        path: /spec/type
        value: ClusterIP

  # --- Remove GKE-specific resources that don't exist in Kind ---
  - path: delete-gke-storage.yaml
