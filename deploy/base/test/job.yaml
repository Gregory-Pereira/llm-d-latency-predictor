# --- Test Job ---
apiVersion: batch/v1
kind: Job
metadata:
  name: latency-predictor-test
  labels:
    app: latency-predictor-test
    component: test
spec:
  template:
    metadata:
      labels:
        app: latency-predictor-test
        component: test
    spec:
      restartPolicy: Never
      containers:
        - name: test-runner
          image: placeholder-for-test-image:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
          env:
            - name: TRAINING_SERVER_URL
              value: "http://training-service:8000"
            - name: PREDICTION_SERVER_URL
              value: "http://prediction-service:80"
            - name: TEST_TIMEOUT
              value: "300"
          command: ["pytest"]
          args:
            - "-v"
            - "-s"
            - "--no-header"
            - "tests/test_dual_server_client.py"
            - "-k"
            - "not stress"
          volumeMounts:
            - name: test-results
              mountPath: /test-results
      volumes:
        - name: test-results
          emptyDir: {}
  backoffLimit: 1
